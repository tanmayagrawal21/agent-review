[project]
name = "agent-review"
version = "0.1.0"
description = "One PR review from three agents (reviewer, safety, privacy) on GitHub Actions, with local redaction before any model."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"bench/cases.py" = ["E501"]  # fixture source lines are kept verbatim
