[project]
name = "agent-review"
version = "0.1.0"
description = "Automatic multi-agent PR review on GitHub Actions: reviewer, privacy and safety agents, one combined review."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
