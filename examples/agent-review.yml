# .github/agent-review.yml. Read from the PR's base branch, so a PR cannot change its own review.
api: openai              # openai: any OpenAI-compatible endpoint | anthropic: Messages API
base_url: https://api.openai.com/v1   # or leave empty and set the AGENT_REVIEW_BASE_URL secret
model: gpt-5.1-mini      # e.g. google/gemini-3-flash (OpenRouter), claude-sonnet-4-5 (api: anthropic), qwen3.5:9b
agents:
  reviewer: {enabled: true}
  privacy:  {enabled: true}
  safety:   {enabled: true, paths: []}   # [] = every PR; e.g. ["auth/**", "infra/**"] to scope it
redact: true             # every text passes through the local PII model before any model sees it
blocking: false          # true: the check fails when an agent requests changes, errors, or cannot run
max_context_chars: 150000
skip: {draft: true, max_changed_lines: 2000}
instructions: |
  Payments code lives in billing/. Amounts are integer cents; never floats.
