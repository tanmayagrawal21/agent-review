# Optional: .github/agent-review.yml. Read from the PR's base branch, so a PR cannot change its own review.
engine: auto             # auto | openai-compatible | claude-code (auto: whichever secret the repo has)
model: ""                # openai-compatible: required, e.g. gpt-5.1-mini, gemini-3-flash, openai/gpt-4o
base_url: ""             # openai-compatible: e.g. https://api.openai.com/v1, https://openrouter.ai/api/v1
agents:
  reviewer: {enabled: true}
  privacy:  {enabled: true, engine: local}   # local (no LLM) | llm | both
  safety:   {enabled: true, paths: []}       # [] = every PR; e.g. ["auth/**", "**/config*", "infra/**"]
blocking: false          # true: the check fails when an agent requests changes, errors, or cannot run
max_budget_usd: 1.0      # claude-code: per agent per run
max_context_chars: 150000  # openai-compatible: diff + changed files sent to the model
skip: {draft: true, max_changed_lines: 2000}
instructions: |
  Payments code lives in billing/. Amounts are integer cents; never floats.
