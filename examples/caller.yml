# Copy to .github/workflows/agent-review.yml in the repository to review.
name: agent-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: tanmayagrawal21/agent-review/.github/workflows/review.yml@v1
    secrets: inherit   # ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN), optional AGENT_REVIEW_PRIVATE_TERMS
