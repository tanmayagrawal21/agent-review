# Config for agent-review's own PRs, using the University of Arizona AI Assistant (OpenAI-compatible LiteLLM
# proxy). Needs the AGENT_REVIEW_API_KEY secret; without it only the local privacy scan runs.
api: openai
base_url: https://ai-assistant.responsibleai.arizona.edu/v1
model: gpt-6.1-sol
instructions: |
  agent-review is security tooling: treat anything that could leak a secret, send unredacted text to a model,
  or let a PR change its own review as blocking.
