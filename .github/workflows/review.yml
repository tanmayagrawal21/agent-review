# Reusable workflow: call it from a repository's pull_request workflow (see examples/caller.yml).
#   prepare  checkout + config at base + local scan and redaction -> bundle.json (redacted)
#   review   one job per agent; input is only the bundle; no checkout, no GitHub token
#   publish  one PR review from the bundle and the findings
name: agent-review

on:
  workflow_call:
    inputs:
      config:
        type: string
        default: .github/agent-review.yml
      tool-repo:
        type: string
        default: tanmayagrawal21/agent-review
      tool-ref:
        description: Version of agent-review to run (keep in step with the @ref you call)
        type: string
        default: v1
    secrets:
      AGENT_REVIEW_API_KEY:
        description: Key for the model endpoint
        required: false
      AGENT_REVIEW_BASE_URL:
        description: The endpoint URL (preferred over base_url in the config, which is public)
        required: false
      AGENT_REVIEW_MODEL:
        description: The model id (preferred over model in the config, which is public)
        required: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.prepare.outputs.run }}
      agents: ${{ steps.prepare.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool-repo }}
          ref: ${{ inputs.tool-ref }}
          path: tool
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "pyyaml==6.0.2"
      - uses: actions/cache@v4
        with:
          path: tool/agent_review/js/node_modules
          key: local-pii-${{ hashFiles('tool/agent_review/js/package-lock.json') }}
      - name: Install the local PII model
        working-directory: tool/agent_review/js
        run: |
          [ -d node_modules/@nationaldesignstudio/rampart ] || npm ci --ignore-scripts --no-audit --no-fund
          node pii.mjs <<< '[{"id":0,"text":"warm up"}]' > /dev/null   # fetches and caches the model once
      - id: prepare
        working-directory: tool
        env:
          HAS_KEY: ${{ secrets.AGENT_REVIEW_API_KEY != '' }}
          HAS_BASE_URL: ${{ secrets.AGENT_REVIEW_BASE_URL != '' }}
          HAS_MODEL: ${{ secrets.AGENT_REVIEW_MODEL != '' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          CONFIG: ${{ inputs.config }}
        run: >
          python -m agent_review.prepare --repo ../pr --base "$BASE" --head "$HEAD" --config "$CONFIG"
          --draft "$DRAFT" --out ../bundle/bundle.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.prepare.outputs.run == 'true'   # also when blocking mode fails the job
        with:
          name: bundle
          path: bundle/bundle.json
          retention-days: 1

  review:
    needs: prepare
    if: needs.prepare.outputs.agents != '[]' && needs.prepare.outputs.agents != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.prepare.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool-repo }}
          ref: ${{ inputs.tool-ref }}
          path: tool
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle
      - working-directory: tool
        env:
          AGENT_REVIEW_API_KEY: ${{ secrets.AGENT_REVIEW_API_KEY }}
          AGENT_REVIEW_BASE_URL: ${{ secrets.AGENT_REVIEW_BASE_URL }}
          AGENT_REVIEW_MODEL: ${{ secrets.AGENT_REVIEW_MODEL }}
          AGENT: ${{ matrix.agent }}
        run: python -m agent_review.review --agent "$AGENT" --bundle ../bundle/bundle.json --out "../out/$AGENT.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings-${{ matrix.agent }}
          path: out/${{ matrix.agent }}.json   # only this agent's own file
          if-no-files-found: ignore
          retention-days: 1

  publish:
    needs: [prepare, review]
    timeout-minutes: 30
    if: ${{ !cancelled() && needs.prepare.outputs.run == 'true' }}   # runs even when prepare failed closed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool-repo }}
          ref: ${{ inputs.tool-ref }}
          path: tool
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "pyyaml==6.0.2"
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: findings-*
          path: findings   # one folder per artifact (findings/findings-<agent>/), never merged
      - working-directory: tool
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: >
          python -m agent_review.publish --bundle ../bundle/bundle.json --findings ../findings --pr "$PR"
