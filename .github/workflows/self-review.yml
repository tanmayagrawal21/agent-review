# agent-review reviews its own pull requests with the version in the PR (dogfooding).
name: self-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: self-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: ./.github/workflows/review.yml
    with:
      tool-repo: ${{ github.repository }}
      tool-ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
